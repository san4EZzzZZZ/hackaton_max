# Локальный стек целиком: `docker compose up --build` поднимает API бота и Mini App, и больше ничего
# не нужно. Переменные читаются из `.env` в этой папке, но ни одна из них не обязательна: на пустом
# клоне BOT_TOKEN получает заглушку, а AUTO_SETUP остаётся выключенным, поэтому стек стартует без
# боевых ключей и без обращений к MAX. За токеном и регистрацией вебхука — шаг «для демо в мессенджере».
#
# Боевой вариант этого же стека (с nginx, HTTPS и автодеплоем) лежит в tools/deploy/docker-compose.yml.

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: max-bot-mvp:latest
    container_name: max-bot
    environment:
      # Compose подставляет значения из .env в этом каталоге, поэтому env_file не нужен — и правильно:
      # на отсутствующем файле env_file останавливает весь запуск.
      BOT_TOKEN: ${BOT_TOKEN:-local-review-placeholder-token}
      BOT_API_URL: ${BOT_API_URL:-https://platform-api2.max.ru}
      BOT_USERNAME: ${BOT_USERNAME:-}
      BOT_NAME: ${BOT_NAME:-Хакатон МАХ 91}
      MINI_APP_URL: ${MINI_APP_URL:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      BOT_WEBHOOK_URL: ${BOT_WEBHOOK_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      # Регистрация меню команд и подписки стучится в MAX. Показ каталога и маршрутов от неё не зависит,
      # так что по умолчанию выключено: локальный прогон не должен дёргать живой API чужим токеном.
      AUTO_SETUP: ${AUTO_SETUP:-false}
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:///data/bot.db}
      # Пустой INGEST_TOKEN оставляет эндпоинты автокаталога с 503 — они переписывают каталог целиком.
      INGEST_TOKEN: ${INGEST_TOKEN:-}
      OSRM_URL: ${OSRM_URL:-https://routing.openstreetmap.de/routed-foot}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Внутри сети контейнер всегда слушает 8080; SERVER_PORT выбирает только порт на хосте.
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
      - ./certs:/app/certs:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  miniapp:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: max-miniapp:latest
    container_name: max-miniapp
    # Ждём, пока бэкенд ответит на /health: фронт на первой же загрузке зовёт /api/v1/cities, и
    # отдавать на этот запрос 502 нет смысла.
    depends_on:
      bot:
        condition: service_healthy
    ports:
      - "${MINIAPP_PORT:-8081}:80"
    restart: unless-stopped
