services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: max-bot-mvp:latest
    container_name: max-bot
    env_file: .env
    environment:
      # Keep the SQLite file on the mounted volume so redeploys do not wipe users.
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:///data/bot.db}
      # The container always listens on 8080; SERVER_PORT only picks the host port.
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
      - ./certs:/app/certs:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
