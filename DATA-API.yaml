openapi: 3.1.0
info:
  title: MAX Hackathon API
  description: 'Спецификация DATA-API: цифровой навигатор и конструктор маршрутов
    выходного дня в мессенджере MAX.'
  version: 1.0.0
paths:
  /api/v1/places:
    get:
      tags:
      - Places
      summary: Список достопримечательностей
      description: Фильтры комбинируются между собой. Порядок ответа — порядок в каталоге,
        радиус ничего не пересортировывает. Сколько объектов подошло до limit/offset
        — в заголовке X-Total-Count.
      operationId: list_places_api_v1_places_get
      parameters:
      - name: city
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Фильтр по городу, подходит краткая форма — «Ростов»
          title: City
        description: Фильтр по городу, подходит краткая форма — «Ростов»
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Фильтр по категории
          title: Category
        description: Фильтр по категории
      - name: is_pushkin_card
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Только по Пушкинской карте
          title: Is Pushkin Card
        description: Только по Пушкинской карте
      - name: max_price
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            minimum: 0
          - type: 'null'
          description: Максимальная стоимость, руб.
          title: Max Price
        description: Максимальная стоимость, руб.
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 2
          - type: 'null'
          description: Поиск по названию, описанию, адресу и категории
          title: Q
        description: Поиск по названию, описанию, адресу и категории
      - name: min_rating
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            maximum: 5
            minimum: 0
          - type: 'null'
          description: Минимальный рейтинг
          title: Min Rating
        description: Минимальный рейтинг
      - name: near_lat
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            maximum: 90
            minimum: -90
          - type: 'null'
          description: Широта центра поиска
          title: Near Lat
        description: Широта центра поиска
      - name: near_lon
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            maximum: 180
            minimum: -180
          - type: 'null'
          description: Долгота центра поиска
          title: Near Lon
        description: Долгота центра поиска
      - name: radius_km
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            maximum: 200
            exclusiveMinimum: 0
          - type: 'null'
          description: Радиус от центра, км
          title: Radius Km
        description: Радиус от центра, км
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 200
            minimum: 1
          - type: 'null'
          description: Сколько объектов вернуть
          title: Limit
        description: Сколько объектов вернуть
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Пропустить N первых объектов
          default: 0
          title: Offset
        description: Пропустить N первых объектов
      responses:
        '200':
          description: Каталог, отфильтрованный по запросу
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Place'
                title: Response List Places Api V1 Places Get
          headers:
            X-Total-Count:
              description: Сколько объектов подошло под фильтры, до применения limit/offset
              schema:
                type: integer
                minimum: 0
            X-Offset:
              description: Смещение, с которого взята текущая страница
              schema:
                type: integer
                minimum: 0
        '422':
          description: 'Некорректный параметр либо их комбинация: тело — список ошибок
            валидации, а для `radius_km` без центра и неполного центра — строка с
            объяснением'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ApiError'
                - $ref: '#/components/schemas/HTTPValidationError'
        '503':
          description: Файл каталога недоступен или повреждён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/places/{place_id}:
    get:
      tags:
      - Places
      summary: Карточка места
      operationId: get_place_api_v1_places__place_id__get
      parameters:
      - name: place_id
        in: path
        required: true
        schema:
          type: string
          title: Place Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
        '404':
          description: Места с таким идентификатором нет
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Файл каталога недоступен или повреждён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/categories:
    get:
      tags:
      - Places
      summary: Доступные категории мест
      operationId: list_categories_api_v1_categories_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  type: string
                type: array
                title: Response List Categories Api V1 Categories Get
        '503':
          description: Файл каталога недоступен или повреждён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/cities:
    get:
      tags:
      - Places
      summary: Города, представленные в каталоге
      description: Города, для которых в данных реально есть объекты, — селектор города
        не предлагает пустой выбор.
      operationId: list_cities_api_v1_cities_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CitySummary'
                type: array
                title: Response List Cities Api V1 Cities Get
        '503':
          description: Файл каталога недоступен или повреждён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/routes/generate:
    post:
      tags:
      - Routes
      summary: Собрать маршрут выходного дня
      operationId: generate_route_api_v1_routes_generate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteResponse'
        '404':
          description: Ни один объект не подошёл под фильтры
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Файл каталога недоступен или повреждён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/routes:
    post:
      tags:
      - Saved routes
      summary: Сохранить собранный маршрут
      description: 'Тело — ответ `POST /routes/generate` без изменений, плюс необязательный
        `user_id`. Идентификатор выдаёт база: присланный внутри маршрута uuid4 остаётся
        только в полезной нагрузке, для обращения к записи он не годится.'
      operationId: create_saved_route_api_v1_routes_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveRouteRequest'
      responses:
        '201':
          description: Запись создана и лежит в базе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedRouteResponse'
        '422':
          description: 'Тело не проходит проверку: список ошибок валидации либо строка
            с перечислением неизвестных каталогу идентификаторов мест'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ApiError'
                - $ref: '#/components/schemas/HTTPValidationError'
        '503':
          description: База данных не отвечает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    get:
      tags:
      - Saved routes
      summary: Сохранённые маршруты
      description: 'Свежие сверху. `user_id` фильтрует по заявленному владельцу —
        это удобство, а не защита: без него видно чужие сохранённые маршруты тоже.
        Всего подходящих записей — в X-Total-Count.'
      operationId: read_saved_routes_api_v1_routes_get
      parameters:
      - name: user_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          description: Только маршруты этого владельца
          title: User Id
        description: Только маршруты этого владельца
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 200
            minimum: 1
          - type: 'null'
          description: Сколько записей вернуть
          title: Limit
        description: Сколько записей вернуть
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Пропустить N первых записей
          default: 0
          title: Offset
        description: Пропустить N первых записей
      responses:
        '200':
          description: Список сохранённых маршрутов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavedRouteResponse'
                title: Response Read Saved Routes Api V1 Routes Get
          headers:
            X-Total-Count:
              description: Сколько объектов подошло под фильтры, до применения limit/offset
              schema:
                type: integer
                minimum: 0
            X-Offset:
              description: Смещение, с которого взята текущая страница
              schema:
                type: integer
                minimum: 0
        '503':
          description: База данных не отвечает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/routes/{route_id}:
    get:
      tags:
      - Saved routes
      summary: Карточка сохранённого маршрута
      operationId: read_saved_route_api_v1_routes__route_id__get
      parameters:
      - name: route_id
        in: path
        required: true
        schema:
          type: integer
          title: Route Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedRouteResponse'
        '404':
          description: Сохранённого маршрута с таким идентификатором нет
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: База данных не отвечает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /webhook:
    post:
      summary: Webhook
      operationId: webhook_webhook_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Update'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /health:
    get:
      summary: Health
      description: Статус базы и число пользователей; 200 даже при недоступной базе.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Health Get
  /readyz:
    get:
      summary: Readyz
      description: 'Готовность принимать трафик: 503, если база не отвечает.'
      operationId: readyz_readyz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Readyz Readyz Get
        '503':
          description: База данных не отвечает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /:
    get:
      summary: Root
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Root  Get
components:
  schemas:
    ApiError:
      properties:
        detail:
          type: string
          title: Detail
          description: Что пошло не так
      type: object
      required:
      - detail
      title: ApiError
      description: Body of every non-2xx answer these endpoints return.
    CallbackPayload:
      properties:
        callback_id:
          type: string
          title: Callback Id
          default: ''
        timestamp:
          type: integer
          title: Timestamp
          default: 0
        payload:
          anyOf:
          - type: string
          - type: 'null'
          title: Payload
        user:
          anyOf:
          - $ref: '#/components/schemas/UserRef'
          - type: 'null'
      type: object
      title: CallbackPayload
    CitySummary:
      properties:
        city:
          type: string
          title: City
          description: Название города
        place_count:
          type: integer
          minimum: 1.0
          title: Place Count
          description: Число объектов в этом городе
        categories:
          items:
            type: string
          type: array
          title: Categories
          description: Категории этих объектов
      type: object
      required:
      - city
      - place_count
      - categories
      title: CitySummary
      description: One city present in the catalog; the seed data holds a single one
        for now.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Location:
      properties:
        lat:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Lat
          description: Широта
        lon:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Lon
          description: Долгота
      type: object
      required:
      - lat
      - lon
      title: Location
    Message:
      properties:
        sender:
          anyOf:
          - $ref: '#/components/schemas/UserRef'
          - type: 'null'
        recipient:
          $ref: '#/components/schemas/MessageRecipient'
        timestamp:
          type: integer
          title: Timestamp
          default: 0
        body:
          $ref: '#/components/schemas/MessageBody'
      type: object
      title: Message
    MessageBody:
      properties:
        mid:
          type: string
          title: Mid
          default: ''
        seq:
          type: integer
          title: Seq
          default: 0
        text:
          anyOf:
          - type: string
          - type: 'null'
          title: Text
        attachments:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Attachments
      type: object
      title: MessageBody
    MessageRecipient:
      properties:
        chat_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Chat Id
        chat_type:
          type: string
          title: Chat Type
          default: dialog
        user_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: User Id
        post_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Post Id
      type: object
      title: MessageRecipient
    Place:
      properties:
        id:
          type: string
          title: Id
          description: Уникальный идентификатор места
        title:
          type: string
          title: Title
          description: Название места или события
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Краткое описание
        category:
          type: string
          title: Category
          description: Категория объекта, см. GET /categories
        location:
          $ref: '#/components/schemas/Location'
        address:
          anyOf:
          - type: string
          - type: 'null'
          title: Address
          description: Адрес
        city:
          type: string
          title: City
          description: Город
          default: Ростов-на-Дону
        is_pushkin_card:
          type: boolean
          title: Is Pushkin Card
          description: Доступно по Пушкинской карте
          default: false
        price:
          type: number
          minimum: 0.0
          title: Price
          description: Стоимость посещения, руб.
          default: 0.0
        working_hours:
          anyOf:
          - type: string
          - type: 'null'
          title: Working Hours
          description: Часы работы
        rating:
          type: number
          maximum: 5.0
          minimum: 0.0
          title: Rating
          description: Рейтинг 0..5
          default: 5.0
        visit_duration_minutes:
          type: integer
          minimum: 15.0
          title: Visit Duration Minutes
          description: Рекомендуемая длительность визита
          default: 60
        image_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Image Url
          description: Ссылка на изображение
      type: object
      required:
      - id
      - title
      - category
      - location
      title: Place
    RouteRequest:
      properties:
        city:
          type: string
          minLength: 2
          title: City
          description: Город; допускается краткая форма — «Ростов»
        categories:
          items:
            type: string
          type: array
          title: Categories
          description: Фильтр по категориям
        max_budget:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Max Budget
          description: Максимальная суммарная стоимость маршрута, руб. Принимается
            и под именем `budget`
        is_pushkin_card_only:
          type: boolean
          title: Is Pushkin Card Only
          description: Только места по Пушкинской карте
          default: false
        duration_hours:
          type: number
          maximum: 12.0
          exclusiveMinimum: 0.0
          title: Duration Hours
          description: Желаемая длительность, ч.
          default: 4.0
      additionalProperties: false
      type: object
      required:
      - city
      title: RouteRequest
    RouteResponse:
      properties:
        route_id:
          type: string
          title: Route Id
        title:
          type: string
          title: Title
        city:
          type: string
          title: City
        total_duration_hours:
          type: number
          minimum: 0.0
          title: Total Duration Hours
          description: Визиты и переходы между точками
        total_cost:
          type: number
          minimum: 0.0
          title: Total Cost
          description: Суммарная стоимость посещения, руб.
        places:
          items:
            $ref: '#/components/schemas/Place'
          type: array
          title: Places
          description: Точки в порядке визита
        stops:
          items:
            $ref: '#/components/schemas/RouteStop'
          type: array
          title: Stops
          description: Те же точки с таймингами переходов; пуст, если маршрут не собран
      type: object
      required:
      - route_id
      - title
      - city
      - total_duration_hours
      - total_cost
      title: RouteResponse
    RouteStop:
      properties:
        place:
          $ref: '#/components/schemas/Place'
        order:
          type: integer
          minimum: 1.0
          title: Order
          description: Позиция точки в маршруте
        arrival_offset_minutes:
          type: integer
          minimum: 0.0
          title: Arrival Offset Minutes
          description: Момент прибытия от начала, мин.
        visit_duration_minutes:
          type: integer
          minimum: 15.0
          title: Visit Duration Minutes
          description: Время на точку, мин.
        travel_minutes_from_prev:
          type: integer
          minimum: 0.0
          title: Travel Minutes From Prev
          description: Переход от предыдущей точки, мин.
          default: 0
      type: object
      required:
      - place
      - order
      - arrival_offset_minutes
      - visit_duration_minutes
      title: RouteStop
      description: One point of an assembled route with its place in the timeline.
    SaveRouteRequest:
      properties:
        route_id:
          type: string
          title: Route Id
        title:
          type: string
          title: Title
        city:
          type: string
          title: City
        total_duration_hours:
          type: number
          minimum: 0.0
          title: Total Duration Hours
          description: Визиты и переходы между точками
        total_cost:
          type: number
          minimum: 0.0
          title: Total Cost
          description: Суммарная стоимость посещения, руб.
        places:
          items:
            $ref: '#/components/schemas/Place'
          type: array
          title: Places
          description: Точки в порядке визита
        stops:
          items:
            $ref: '#/components/schemas/RouteStop'
          type: array
          title: Stops
          description: Те же точки с таймингами переходов; пуст, если маршрут не собран
        user_id:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: User Id
          description: 'Владелец маршрута. Не аутентифицируется: см. README, раздел
            про сохранённые маршруты'
      additionalProperties: false
      type: object
      required:
      - route_id
      - title
      - city
      - total_duration_hours
