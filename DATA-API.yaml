openapi: 3.1.0
info:
  title: MAX Hackathon API
  description: 'Спецификация DATA-API: цифровой навигатор и конструктор маршрутов
    выходного дня в мессенджере MAX.'
  version: 1.0.0
paths:
  /api/v1/places:
    get:
      tags:
      - Places
      summary: Список достопримечательностей
      description: 'Фильтры комбинируются между собой: `category` отвечает «что это
        за объект», `tag` — «зачем сюда идут», и это независимые оси. Порядок ответа
        — порядок в каталоге, радиус ничего не пересортировывает. Сколько объектов
        подошло до limit/offset — в заголовке X-Total-Count.'
      operationId: list_places_api_v1_places_get
      parameters:
      - name: city
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Фильтр по городу, подходит краткая форма — «Ростов»
          title: City
        description: Фильтр по городу, подходит краткая форма — «Ростов»
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Фильтр по категории
          title: Category
        description: Фильтр по категории
      - name: tag
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: 'Фильтр по настроению: id из `GET /chips`, повторяется в URL
            несколько раз. Внутри списка — ИЛИ (место годится, если у него есть хотя
            бы одна из запрошенных меток), с `category` — И. Неизвестный id не находит
            ничего, как и неизвестная категория'
          title: Tag
        description: 'Фильтр по настроению: id из `GET /chips`, повторяется в URL
          несколько раз. Внутри списка — ИЛИ (место годится, если у него есть хотя
          бы одна из запрошенных меток), с `category` — И. Неизвестный id не находит
          ничего, как и неизвестная категория'
      - name: is_pushkin_card
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Только по Пушкинской карте
          title: Is Pushkin Card
        description: Только по Пушкинской карте
      - name: max_price
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            minimum: 0
          - type: 'null'
          description: Максимальная стоимость, руб.
          title: Max Price
        description: Максимальная стоимость, руб.
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 2
          - type: 'null'
          description: Поиск по названию, описанию, адресу и категории
          title: Q
        description: Поиск по названию, описанию, адресу и категории
      - name: min_rating
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            maximum: 5
            minimum: 0
          - type: 'null'
          description: Минимальный рейтинг
          title: Min Rating
        description: Минимальный рейтинг
      - name: near_lat
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            maximum: 90
            minimum: -90
          - type: 'null'
          description: Широта центра поиска
          title: Near Lat
        description: Широта центра поиска
      - name: near_lon
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            maximum: 180
            minimum: -180
          - type: 'null'
          description: Долгота центра поиска
          title: Near Lon
        description: Долгота центра поиска
      - name: radius_km
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            maximum: 200
            exclusiveMinimum: 0
          - type: 'null'
          description: Радиус от центра, км
          title: Radius Km
        description: Радиус от центра, км
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 200
            minimum: 1
          - type: 'null'
          description: Сколько объектов вернуть
          title: Limit
        description: Сколько объектов вернуть
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Пропустить N первых объектов
          default: 0
          title: Offset
        description: Пропустить N первых объектов
      responses:
        '200':
          description: Каталог, отфильтрованный по запросу
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Place'
                title: Response List Places Api V1 Places Get
          headers:
            X-Total-Count:
              description: Сколько объектов подошло под фильтры, до применения limit/offset
              schema:
                type: integer
                minimum: 0
            X-Offset:
              description: Смещение, с которого взята текущая страница
              schema:
                type: integer
                minimum: 0
        '422':
          description: 'Некорректный параметр либо их комбинация: тело — список ошибок
            валидации, а для `radius_km` без центра и неполного центра — строка с
            объяснением'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ApiError'
                - $ref: '#/components/schemas/HTTPValidationError'
        '503':
          description: Файл каталога недоступен или повреждён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/places/{place_id}:
    get:
      tags:
      - Places
      summary: Карточка места
      operationId: get_place_api_v1_places__place_id__get
      parameters:
      - name: place_id
        in: path
        required: true
        schema:
          type: string
          title: Place Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
        '404':
          description: Места с таким идентификатором нет
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Файл каталога недоступен или повреждён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/categories:
    get:
      tags:
      - Places
      summary: Доступные категории мест
      operationId: list_categories_api_v1_categories_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  type: string
                type: array
                title: Response List Categories Api V1 Categories Get
        '503':
          description: Файл каталога недоступен или повреждён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/chips:
    get:
      tags:
      - Places
      summary: Чипы «Чем хочешь заняться?»
      description: 'Настроенческие чипы экрана настройки прогулки вместе с числом
        мест, которые под ними реально лежат. Пустого чипа в ответе не бывает, поэтому
        список рисуют как есть, без своего перечня «что из этого работает». Порядок
        постоянный: кофе, культура, прогулка, перекус, фото.'
      operationId: list_chips_api_v1_chips_get
      parameters:
      - name: city
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Считать чипы только по местам этого города
          title: City
        description: Считать чипы только по местам этого города
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Chip'
                title: Response List Chips Api V1 Chips Get
        '503':
          description: Файл каталога недоступен или повреждён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/cities:
    get:
      tags:
      - Places
      summary: Города, представленные в каталоге
      description: Города, для которых в данных реально есть объекты, — селектор города
        не предлагает пустой выбор.
      operationId: list_cities_api_v1_cities_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CitySummary'
                type: array
                title: Response List Cities Api V1 Cities Get
        '503':
          description: Файл каталога недоступен или повреждён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/guides:
    get:
      tags:
      - Guides
      summary: Места, для которых справка уже написана
      description: 'Указатель к GET /places/{place_id}/guide: плашку «📖» вешают на
        этот список, а не на 404. Отсутствующая справка — не ошибка, а место, очередь
        которого ещё не дошла.'
      operationId: list_guides_api_v1_guides_get
      parameters:
      - name: city
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Фильтр по городу, подходит краткая форма — «Ростов»
          title: City
        description: Фильтр по городу, подходит краткая форма — «Ростов»
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GuideSummary'
                title: Response List Guides Api V1 Guides Get
        '503':
          description: Файл справок недоступен или повреждён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/places/{place_id}/guide:
    get:
      tags:
      - Guides
      summary: Справка по месту
      description: Экран чтения для одной точки маршрута. `price`, `working_hours`
        и `title` приходят из каталога, а не из текста справки, поэтому не могут с
        ним разойтись; `nearby` считает тот же пеший ход, что и маршрутизатор.
      operationId: get_place_guide_api_v1_places__place_id__guide_get
      parameters:
      - name: place_id
        in: path
        required: true
        schema:
          type: string
          title: Place Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceGuide'
        '404':
          description: Места с таким идентификатором нет, либо справка для него ещё
            не написана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Файл справок или файл каталога недоступны либо повреждены;
            в `detail` назван тот, который не читается
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/routes/generate:
    post:
      tags:
      - Routes
      summary: Собрать маршрут выходного дня
      operationId: generate_route_api_v1_routes_generate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteResponse'
        '404':
          description: Ни один объект не подошёл под фильтры
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Файл каталога недоступен или повреждён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/routes:
    post:
      tags:
      - Saved routes
      summary: Сохранить собранный маршрут
      description: 'Тело — ответ `POST /routes/generate` без изменений, плюс необязательный
        `user_id`. Идентификатор выдаёт база: присланный внутри маршрута uuid4 остаётся
        только в полезной нагрузке, для обращения к записи он не годится.'
      operationId: create_saved_route_api_v1_routes_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveRouteRequest'
      responses:
        '201':
          description: Запись создана и лежит в базе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedRouteResponse'
        '422':
          description: 'Тело не проходит проверку: список ошибок валидации либо строка
            с перечислением неизвестных каталогу идентификаторов мест'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ApiError'
                - $ref: '#/components/schemas/HTTPValidationError'
        '503':
          description: База данных не отвечает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    get:
      tags:
      - Saved routes
      summary: Сохранённые маршруты
      description: 'Свежие сверху. `user_id` фильтрует по заявленному владельцу —
        это удобство, а не защита: без него видно чужие сохранённые маршруты тоже.
        Всего подходящих записей — в X-Total-Count.'
      operationId: read_saved_routes_api_v1_routes_get
      parameters:
      - name: user_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 9223372036854775807
            minimum: 1
          - type: 'null'
          description: Только маршруты этого владельца
          title: User Id
        description: Только маршруты этого владельца
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 200
            minimum: 1
          - type: 'null'
          description: Сколько записей вернуть
          title: Limit
        description: Сколько записей вернуть
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Пропустить N первых записей
          default: 0
          title: Offset
        description: Пропустить N первых записей
      responses:
        '200':
          description: Список сохранённых маршрутов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavedRouteResponse'
                title: Response Read Saved Routes Api V1 Routes Get
          headers:
            X-Total-Count:
              description: Сколько объектов подошло под фильтры, до применения limit/offset
              schema:
                type: integer
                minimum: 0
            X-Offset:
              description: Смещение, с которого взята текущая страница
              schema:
                type: integer
                minimum: 0
        '503':
          description: База данных не отвечает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/routes/{route_id}:
    get:
      tags:
      - Saved routes
      summary: Карточка сохранённого маршрута
      operationId: read_saved_route_api_v1_routes__route_id__get
      parameters:
      - name: route_id
        in: path
        required: true
        schema:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          description: Идентификатор записи, выдаёт база
          title: Route Id
        description: Идентификатор записи, выдаёт база
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedRouteResponse'
        '404':
          description: Сохранённого маршрута с таким идентификатором нет
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: База данных не отвечает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /webhook:
    post:
      summary: Webhook
      operationId: webhook_webhook_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Update'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /health:
    get:
      summary: Health
      description: Статус базы и число пользователей; 200 даже при недоступной базе.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Health Get
  /readyz:
    get:
      summary: Readyz
      description: 'Готовность принимать трафик: 503, если база не отвечает.'
      operationId: readyz_readyz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Readyz Readyz Get
        '503':
          description: База данных не отвечает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /:
    get:
      summary: Root
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Root  Get
components:
  schemas:
    ApiError:
      properties:
        detail:
          type: string
          title: Detail
          description: Что пошло не так
      type: object
      required:
      - detail
      title: ApiError
      description: Body of every non-2xx answer these endpoints return.
    CallbackPayload:
      properties:
        callback_id:
          type: string
          title: Callback Id
          default: ''
        timestamp:
          type: integer
          title: Timestamp
          default: 0
        payload:
          anyOf:
          - type: string
          - type: 'null'
          title: Payload
        user:
          anyOf:
          - $ref: '#/components/schemas/UserRef'
          - type: 'null'
      type: object
      title: CallbackPayload
    Chip:
      properties:
        id:
          type: string
          enum:
          - coffee
          - culture
          - walk
          - food
          - photo
          title: Id
          description: Идентификатор чипа; его клиент и шлёт в `tags` запроса маршрута
        label:
          type: string
          title: Label
          description: Подпись на чипе
        emoji:
          type: string
          title: Emoji
          description: Значок чипа
        tags:
          items:
            type: string
            enum:
            - coffee
            - culture
            - walk
            - food
            - photo
          type: array
          title: Tags
          description: Метки мест, которые выбирает чип; их пересечение с `Place.tags`
            непусто
        place_count:
          type: integer
          minimum: 1.0
          title: Place Count
          description: 'Сколько мест каталога подходят под чип. Нуля здесь не бывает:
            чип, на котором нечего показать, до клиента не доезжает, а не приезжает
            пустым'
      type: object
      required:
      - id
      - label
      - emoji
      - tags
      - place_count
      title: Chip
      description: Один чип «Чем хочешь заняться?» — вместе с тем, что под него действительно
        лежит.
    CitySummary:
      properties:
        city:
          type: string
          title: City
          description: Название города
        place_count:
          type: integer
          minimum: 1.0
          title: Place Count
          description: Число объектов в этом городе
        categories:
          items:
            type: string
          type: array
          title: Categories
          description: Категории этих объектов
      type: object
      required:
      - city
      - place_count
      - categories
      title: CitySummary
      description: One city present in the catalog; the seed data holds a single one
        for now.
    GuideMedia:
      properties:
        url:
          type: string
          title: Url
          description: Оригинал файла на Commons
        thumb_url:
          type: string
          title: Thumb Url
          description: Миниатюра того же файла — показывать клиенту её
        caption:
          type: string
          minLength: 3
          title: Caption
          description: Что на снимке
        credit:
          type: string
          minLength: 2
          title: Credit
          description: Автор, как указан на странице файла
        license:
          type: string
          minLength: 2
          title: License
          description: Лицензия, например CC BY-SA 4.0
        license_url:
          anyOf:
          - type: string
          - type: 'null'
          title: License Url
          description: Страница лицензии; null только у public domain, где ссылки
            на лицензию нет
      type: object
      required:
      - url
      - thumb_url
      - caption
      - credit
      - license
      title: GuideMedia
      description: Один снимок справки. Оба адреса ведут на Wikimedia Commons — чужие
        хосты сервер не раздаёт.
    GuideProvenance:
      properties:
        source_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Url
          description: Страница источника; без неё справка считается неподтверждённой
        last_verified:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Last Verified
          description: Дата, когда редактор сверил запись с источником
        verified_fields:
          items:
            type: string
          type: array
          title: Verified Fields
          description: Поля записи, сверенные с этим источником (history, highlights,
            media)
      type: object
      title: GuideProvenance
      description: Чем справка подтверждена и где именно редактор взял факты.
    GuideSummary:
      properties:
        place_id:
          type: string
          title: Place Id
          description: Идентификатор места — адрес GET /places/{place_id}/guide
        title:
          type: string
          title: Title
          description: Название места из каталога
        category:
          type: string
          title: Category
          description: Категория объекта
        city:
          type: string
          title: City
          description: Город
        status:
          type: string
          enum:
          - ready
          - seed
          title: Status
          description: ready или seed
        cover_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Cover Url
          description: Обложка — `image_url` места; второй ссылки на картинку у клиента
            нет
        media_count:
          type: integer
          minimum: 0.0
          title: Media Count
          description: Сколько снимков лежит в справке
        last_verified:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Last Verified
          description: Дата последней сверки текста с источником
      type: object
      required:
      - place_id
      - title
      - category
      - city
      - status
      - media_count
      title: GuideSummary
      description: 'Указатель на справку: плашку «📖» вешают на него, а не проверяют
        404 на каждом месте.'
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Location:
      properties:
        lat:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Lat
          description: Широта
        lon:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Lon
          description: Долгота
      type: object
      required:
      - lat
      - lon
      title: Location
    Message:
      properties:
        sender:
          anyOf:
          - $ref: '#/components/schemas/UserRef'
          - type: 'null'
        recipient:
          $ref: '#/components/schemas/MessageRecipient'
        timestamp:
          type: integer
          title: Timestamp
          default: 0
        body:
          $ref: '#/components/schemas/MessageBody'
      type: object
      title: Message
    MessageBody:
      properties:
        mid:
          type: string
          title: Mid
          default: ''
        seq:
          type: integer
          title: Seq
          default: 0
        text:
          anyOf:
          - type: string
          - type: 'null'
          title: Text
        attachments:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Attachments
      type: object
      title: MessageBody
    MessageRecipient:
      properties:
        chat_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Chat Id
        chat_type:
          type: string
          title: Chat Type
          default: dialog
        user_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: User Id
        post_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Post Id
      type: object
      title: MessageRecipient
    NearbyPlace:
      properties:
        id:
          type: string
          title: Id
          description: Идентификатор места — по нему просят и его справку
        title:
          type: string
          title: Title
          description: Название места
        category:
          type: string
          title: Category
          description: Категория объекта
        distance_m:
          type: integer
          minimum: 0.0
          title: Distance M
          description: По прямой от этого места, м
        travel_minutes:
          type: integer
          minimum: 1.0
          title: Travel Minutes
          description: 'Переход пешком в том же исчислении, что и `travel_minutes_from_prev`
            у маршрута: оценка планировщика, а не навигатора'
      type: object
      required:
      - id
      - title
      - category
      - distance_m
      - travel_minutes
      title: NearbyPlace
      description: 'Соседняя точка: экран справки обещает «рядом», и эти же минуты
        показывает маршрут.'
    Place:
      properties:
        id:
          type: string
          title: Id
          description: Уникальный идентификатор места
        title:
          type: string
          title: Title
          description: Название места или события
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Краткое описание
        category:
          type: string
          title: Category
          description: Категория объекта, см. GET /categories
        tags:
          items:
            type: string
            enum:
            - coffee
            - culture
            - walk
            - food
            - photo
          type: array
          title: Tags
          description: 'Зачем сюда идут: кофе, культура, прогулка, перекус, фото.
            id те же, что у `Chip.id` в GET /chips; пустой список — место вне настроенческих
            подборок'
        location:
          $ref: '#/components/schemas/Location'
        address:
          anyOf:
          - type: string
          - type: 'null'
          title: Address
          description: Адрес
        city:
          type: string
          title: City
          description: Город
          default: Ростов-на-Дону
        is_pushkin_card:
          type: boolean
          title: Is Pushkin Card
          description: Доступно по Пушкинской карте
          default: false
        price:
          type: number
          minimum: 0.0
          title: Price
          description: Стоимость посещения, руб.
          default: 0.0
        working_hours:
          anyOf:
          - type: string
          - type: 'null'
          title: Working Hours
          description: Часы работы
        rating:
          type: number
          maximum: 5.0
          minimum: 0.0
          title: Rating
          description: Рейтинг 0..5
          default: 5.0
        visit_duration_minutes:
          type: integer
          minimum: 15.0
          title: Visit Duration Minutes
          description: Рекомендуемая длительность визита
          default: 60
        image_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Image Url
          description: Миниатюра с Wikimedia Commons, ссылка на чужой хост; null —
            подходящего фото нет
      type: object
      required:
      - id
      - title
      - category
      - location
      title: Place
    PlaceGuide:
      properties:
        place_id:
          type: string
          title: Place Id
          description: Идентификатор места из data/places.json
        status:
          type: string
          enum:
          - ready
          - seed
          title: Status
          description: ready — справка полная, seed — заготовка, которой делятся честно
          default: seed
        history:
          items:
            type: string
            minLength: 120
            description: Абзац истории места
          type: array
          maxItems: 3
          minItems: 2
          title: History
          description: 2–3 абзаца истории
        highlights:
          items:
            type: string
            minLength: 12
            description: Короткий факт, который проверяется прямо на месте
          type: array
          maxItems: 5
          minItems: 3
          title: Highlights
          description: 3–5 фактов для человека на месте
        media:
          items:
            $ref: '#/components/schemas/GuideMedia'
          type: array
          title: Media
          description: Снимки; первым идёт обложка
        media_note:
          anyOf:
          - type: string
          - type: 'null'
          title: Media Note
          description: 'Почему снимков нет. Обязателен, если media пусто: пустая подборка
            не должна выглядеть решением'
        provenance:
          $ref: '#/components/schemas/GuideProvenance'
        title:
          type: string
          title: Title
          description: Название места из каталога
        category:
          type: string
          title: Category
          description: Категория объекта из каталога
        city:
          type: string
          title: City
          description: Город из каталога
        location:
          $ref: '#/components/schemas/Location'
        price:
          type: number
          minimum: 0.0
          title: Price
          description: Стоимость посещения, руб. — то же число, что в карточке места
        working_hours:
          anyOf:
          - type: string
          - type: 'null'
          title: Working Hours
          description: Часы работы — тоже эхом из каталога
        visit_duration_minutes:
          type: integer
          minimum: 15.0
          title: Visit Duration Minutes
          description: Время на точку, которое под это место закладывает маршрутизатор
        nearby:
          items:
            $ref: '#/components/schemas/NearbyPlace'
          type: array
          title: Nearby
          description: Ближайшие к этому месту объекты каталога, по расстоянию
      type: object
      required:
      - place_id
      - history
      - highlights
      - provenance
      - title
      - category
      - city
      - location
      - price
      - visit_duration_minutes
      title: PlaceGuide
      description: 'Справка для клиента: редакторский текст плюс поля, эхом взятые
        из каталога, и соседи.'
    RouteRequest:
      properties:
        city:
          type: string
          minLength: 2
          title: City
          description: Город; допускается краткая форма — «Ростов»
        categories:
          items:
            type: string
          type: array
          title: Categories
          description: Фильтр по категориям
        tags:
          items:
            type: string
          type: array
          title: Tags
          description: 'Фильтр по настроению: id из GET /chips. Внутри списка — ИЛИ
            (место годится, если у него есть хотя бы одна из запрошенных меток), между
            `tags` и `categories` — И. Пустой список ничего не ограничивает, а неизвестный
            id не находит мест и даёт 404 — как категория'
        max_budget:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Max Budget
          description: Максимальная суммарная стоимость маршрута, руб. Принимается
            и под именем `budget`
        is_pushkin_card_only:
          type: boolean
          title: Is Pushkin Card Only
          description: Только места по Пушкинской карте
          default: false
        duration_hours:
          type: number
          maximum: 12.0
          exclusiveMinimum: 0.0
          title: Duration Hours
          description: 'Желаемая длительность, ч. Маршрут планируется короче: 15 %
            этого времени остаётся в резерве на очереди и темп прогулки, а не отдаётся
            новой точке'
          default: 4.0
        start_lat:
          anyOf:
          - type: number
            maximum: 90.0
            minimum: -90.0
          - type: 'null'
          title: Start Lat
          description: 'Широта точки, из которой начинают прогулку, deg — вместе с
            `start_lon`. Без неё маршрут строится как раньше: первой точкой планировщика,
            без перехода к ней. С ней первые `travel_minutes_from_prev` и `distance_m_from_prev`
            считаются от старта и съедают бюджет времени, а слишком далёкие места
            до фильтрации не доходят'
        start_lon:
          anyOf:
          - type: number
            maximum: 180.0
            minimum: -180.0
          - type: 'null'
          title: Start Lon
          description: Долгота точки старта, deg — вместе с `start_lat`
      additionalProperties: false
      type: object
      required:
      - city
      title: RouteRequest
    RouteResponse:
      properties:
        route_id:
          type: string
          title: Route Id
        title:
          type: string
          title: Title
        city:
          type: string
          title: City
        start:
          anyOf:
          - $ref: '#/components/schemas/Location'
          - type: 'null'
          description: Точка старта из запроса; None, если старт не передавали
        total_duration_hours:
          type: number
          minimum: 0.0
          title: Total Duration Hours
          description: Визиты и переходы между точками, включая переход от старта
            к первой точке
        total_duration_minutes:
          type: integer
          minimum: 0.0
          title: Total Duration Minutes
          description: То же число в минутах, без округления до сотых часа
          default: 0
        total_distance_m:
          type: integer
          minimum: 0.0
          title: Total Distance M
          description: Сумма прямых расстояний между соседними точками, м, включая
            отрезок от старта до первой точки
          default: 0
        slack_minutes:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Slack Minutes
          description: 'Свободные минуты до конца заказанной длительности. Планировщик
            тратит не больше 85 % запрошенного времени: остальные 15 % — резерв на
            очереди, закрытую дверь и темп прогулки'
        total_cost:
          type: number
          minimum: 0.0
          title: Total Cost
          description: Суммарная стоимость посещения, руб.
        places:
          items:
            $ref: '#/components/schemas/Place'
          type: array
          title: Places
          description: Точки в порядке визита
        stops:
          items:
            $ref: '#/components/schemas/RouteStop'
          type: array
          title: Stops
          description: Те же точки с таймингами переходов; пуст, если маршрут не собран
      type: object
      required:
      - route_id
      - title
      - city
      - total_duration_hours
      - total_cost
      title: RouteResponse
    RouteStop:
      properties:
        place:
          $ref: '#/components/schemas/Place'
        order:
          type: integer
          minimum: 1.0
          title: Order
          description: Позиция точки в маршруте
        arrival_offset_minutes:
          type: integer
          minimum: 0.0
          title: Arrival Offset Minutes
          description: Момент прибытия от начала, мин.
        visit_duration_minutes:
          type: integer
          minimum: 15.0
          title: Visit Duration Minutes
          description: Время на точку, мин.
        travel_minutes_from_prev:
          type: integer
          minimum: 0.0
          title: Travel Minutes From Prev
          description: 'Переход от предыдущей точки, мин; у первой точки — от `start`
            запроса, или 0, если старта не было. Оценка планировщика (пеший ход плюс
            запас на ожидание), а не ETA навигатора: путь по тротуарам всегда дольше'
          default: 0
        distance_m_from_prev:
          type: integer
          minimum: 0.0
          title: Distance M From Prev
          description: Расстояние от предыдущей точки по прямой, м; у первой точки
            — от точки старта, если она передана, иначе 0. Длина тротуарного обхода
            всегда больше, поэтому подпись «N км пешком» честнее читать «N км напрямую»
          default: 0
      type: object
      required:
      - place
      - order
      - arrival_offset_minutes
      - visit_duration_minutes
      title: RouteStop
      description: One point of an assembled route with its place in the timeline.
    SaveRouteRequest:
      properties:
        route_id:
          type: string
          title: Route Id
        title:
          type: string
          title: Title
        city:
          type: string
          title: City
        start:
          anyOf:
          - $ref: '#/components/schemas/Location'
          - type: 'null'
          description: Точка старта из запроса; None, если старт не передавали
        total_duration_hours:
          type: number
          minimum: 0.0
          title: Total Duration Hours
          description: Визиты и переходы между точками, включая переход от старта
            к первой точке
        total_duration_minutes:
          type: integer
          minimum: 0.0
          title: Total Duration Minutes
          description: То же число в минутах, без округления до сотых часа
          default: 0
        total_distance_m:
          type: integer
          minimum: 0.0
          title: Total Distance M
          description: Сумма прямых расстояний между соседними точками, м, включая
            отрезок от старта до первой точки
          default: 0
        slack_minutes:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Slack Minutes
          description: 'Свободные минуты до конца заказанной длительности. Планировщик
            тратит не больше 85 % запрошенного времени: остальные 15 % — резерв на
            очереди, закрытую дверь и темп прогулки'
        total_cost:
          type: number
          minimum: 0.0
          title: Total Cost
          description: Суммарная стоимость посещения, руб.
        places:
          items:
            $ref: '#/components/schemas/Place'
          type: array
          title: Places
          description: Точки в порядке визита
        stops:
          items:
            $ref: '#/components/schemas/RouteStop'
          type: array
          title: Stops
          description: Те же точки с таймингами переходов; пуст, если маршрут не собран
        user_id:
          anyOf:
          - type: integer
            maximum: 9.223372036854776e+18
            minimum: 1.0
          - type: 'null'
          title: User Id
          description: 'Владелец маршрута. Не аутентифицируется: см. README, раздел
            про сохранённые маршруты'
      additionalProperties: false
      type: object
      required:
      - route_id
      - title
      - city
      - total_duration_hours
      - total_cost
      title: SaveRouteRequest
      description: 'Ответ генератора, отправленный обратно без изменений, плюс необязательный
        владелец.


        Наследование держит обещание буквальный: сохраняется ровно то, что вернул

        `POST /routes/generate`. Неизвестные ключи отвергаются по той же причине,
        что и у `RouteRequest`.'
    SavedRouteResponse:
      properties:
        route_id:
          type: integer
          title: Route Id
          description: Идентификатор записи, выдаёт база
        user_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: User Id
          description: Владелец, если его передали при сохранении
        title:
          type: string
          title: Title
        city:
          type: string
          title: City
        total_cost:
          type: number
          minimum: 0.0
          title: Total Cost
          description: Стоимость маршрута на момент сохранения, руб.
        stop_count:
          type: integer
          minimum: 0.0
          title: Stop Count
          description: Число точек в сохранённом маршруте
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Момент сохранения, UTC
        route:
          $ref: '#/components/schemas/RouteResponse'
          description: Ответ генератора ровно так, как он сохранён
      type: object
      required:
      - route_id
      - title
      - city
      - total_cost
      - stop_count
      - created_at
      - route
      title: SavedRouteResponse
      description: 'Сохранённый маршрут: исходный ответ генератора под собственным
        постоянным идентификатором.'
    Update:
      properties:
        update_type:
          type: string
          minLength: 1
          title: Update Type
        timestamp:
          type: integer
          title: Timestamp
          default: 0
        chat_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Chat Id
        user:
          anyOf:
          - $ref: '#/components/schemas/UserRef'
          - type: 'null'
        message:
          anyOf:
          - $ref: '#/components/schemas/Message'
          - type: 'null'
        callback:
          anyOf:
          - $ref: '#/components/schemas/CallbackPayload'
          - type: 'null'
        payload:
          anyOf:
          - type: string
          - type: 'null'
          title: Payload
        is_channel:
          type: boolean
          title: Is Channel
          default: false
        user_locale:
          anyOf:
          - type: string
          - type: 'null'
          title: User Locale
      type: object
      required:
      - update_type
      title: Update
      description: Envelope for every event MAX delivers to a webhook or returns from
        `/updates`.
    UserRef:
      properties:
        user_id:
          type: integer
          title: User Id
        name:
          type: string
          title: Name
          default: ''
        first_name:
          type: string
          title: First Name
          default: ''
        last_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Name
        username:
          anyOf:
          - type: string
          - type: 'null'
          title: Username
        is_bot:
          type: boolean
          title: Is Bot
          default: false
        last_activity_time:
          anyOf:
          - type: integer
          - type: 'null'
          title: Last Activity Time
      type: object
      required:
      - user_id
      title: UserRef
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
servers:
- url: http://localhost:8080
  description: Локальный сервер разработки
