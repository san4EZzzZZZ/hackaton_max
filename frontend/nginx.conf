# Конфиг контейнера Mini App для `docker compose up`: статика из dist/ плюс тот же nginx проксирует
# /api на сервис `bot`. Фронт зовёт относительный `/api/v1` (frontend/src/lib/api.js), поэтому локальный
# запуск не требует ни CORS-исключений, ни переменных сборки — адрес бэкенда выбирает этот файл.
#
# Прокси повторяет боевой tools/deploy/nginx-max-app.conf, где роль 127.0.0.1:8080 играет имя `bot`.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # До имён из compose нужно досчитать в момент запроса: при `depends_on` без условия nginx иначе
    # падает на старте, если бэкенд ещё не поднялся. Переменная в proxy_pass отключает подстановку
    # префикса location, поэтому URI передаётся целиком ($request_uri включает и query-строку).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://bot:8080;

    location /api/ {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Служебные и документационные маршруты живут в том же приложении, что и API: проверяющему
    # достаточно одного порта, чтобы открыть /docs и убедиться, что база отвечает.
    location ~ ^/(health|readyz|docs|openapi\.json)$ {
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Собранные Vite файлы именованы по хешу и неуязвимы к замене содержимого, входной документ — нет.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # One-page app: любой неизвестный путь отдаёт то же приложение.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
